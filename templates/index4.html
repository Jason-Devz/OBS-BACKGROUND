<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Silk Waves Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 25%, rgba(0, 0, 0, 0.75) 75%, rgba(0, 0, 0, 0.98) 100%);
        }
    </style>
</head>
<body>

    <canvas id="waveCanvas"></canvas>
    <div class="vignette"></div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let step = 0;

        const particles = [];
        const particleCount = 50;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: -(Math.random() * 0.4 + 0.2),
                    alpha: Math.random() * 0.6 + 0.2,
                    color: Math.random() > 0.5 ? '59, 130, 246' : '147, 51, 234'
                });
            }
        }

        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.y < -10) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawWaves() {
            const waveLines = 7;
            const colors = [
                'rgba(59, 130, 246, ',
                'rgba(147, 51, 234, ',
                'rgba(6, 182, 212, ',
                'rgba(99, 102, 241, '
            ];

            for (let i = 0; i < waveLines; i++) {
                ctx.beginPath();
                ctx.lineWidth = 1.8;
                
                const alpha = 0.38 - (i * 0.04);
                const colorPrefix = colors[i % colors.length];
                ctx.strokeStyle = colorPrefix + alpha + ')';

                ctx.shadowBlur = 14;
                ctx.shadowColor = i % 2 === 0 ? '#3b82f6' : '#9333ea';

                const waveOffset = i * 0.45;
                const speed = step * 0.009;

                for (let x = 0; x <= width + 20; x += 15) {
                    const y = height * 0.5 + 
                        Math.sin(x * 0.003 + speed + waveOffset) * 115 +
                        Math.sin(x * 0.007 - speed * 0.8 + waveOffset) * 55 +
                        Math.cos(x * 0.002 + speed * 0.5) * 40;

                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            step += 1;

            drawWaves();
            drawParticles();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
</body>
</html>
