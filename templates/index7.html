<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Infinite Tunnel Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #tunnelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.8) 75%, rgba(0, 0, 0, 0.99) 100%);
        }
    </style>
</head>
<body>

    <canvas id="tunnelCanvas"></canvas>
    <div class="vignette"></div>

    <script>
        const canvas = document.getElementById('tunnelCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let speed = 1.2;
        let time = 0;

        const rings = [];
        const ringCount = 28;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initRings();
        }

        function initRings() {
            rings.length = 0;
            for (let i = 0; i < ringCount; i++) {
                rings.push({
                    z: i * 35,
                    rot: (i * 0.08)
                });
            }
        }

        function drawTunnel() {
            const centerX = width / 2;
            const centerY = height / 2;
            const fov = 320;
            const maxZ = ringCount * 35;

            for (let i = 0; i < rings.length; i++) {
                const ring = rings[i];
                ring.z -= speed;

                if (ring.z <= 10) {
                    ring.z += maxZ;
                    ring.rot = time * 0.002;
                }

                const scale = fov / ring.z;
                const size = 180 * scale;

                if (scale < 0.05 || size > width * 2) continue;

                const alpha = Math.min(1, Math.max(0, (1 - ring.z / maxZ))) * 0.45;
                const sides = 8;
                const rot = ring.rot + time * 0.001;

                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = Math.max(0.8, 2.2 * scale);

                if (i % 4 === 0) {
                    ctx.shadowBlur = 12 * scale;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                for (let s = 0; s < sides; s++) {
                    const angle = (Math.PI * 2 / sides) * s + rot;
                    const x = centerX + Math.cos(angle) * size;
                    const y = centerY + Math.sin(angle) * size;

                    if (s === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += 1;
            drawTunnel();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
</body>
</html>
