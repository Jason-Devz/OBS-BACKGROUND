<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Grid Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 5, 8, 0.8) 80%, rgba(3, 3, 5, 0.98) 100%);
        }
    </style>
</head>
<body>

    <canvas id="gridCanvas"></canvas>
    <div class="vignette"></div>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');

        const config = {
            gridSize: 50,
            lineOpacity: 0.08,
            crossOpacity: 0.25,
            crossSize: 3
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawGrid();
        }

        window.addEventListener('resize', resizeCanvas);

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const { gridSize, lineOpacity, crossOpacity, crossSize } = config;

            ctx.strokeStyle = `rgba(255, 255, 255, ${lineOpacity})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            ctx.stroke();

            ctx.beginPath();
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = `rgba(255, 255, 255, ${crossOpacity})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) {
                for (let y = 0; y <= canvas.height; y += gridSize) {
                    ctx.moveTo(x - crossSize, y);
                    ctx.lineTo(x + crossSize, y);
                    ctx.moveTo(x, y - crossSize);
                    ctx.lineTo(x, y + crossSize);
                }
            }
            ctx.stroke();
        }

        resizeCanvas();
    </script>
</body>
</html>
